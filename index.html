<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무너뜨릴벽은 많다 - 월별 장애인식개선 계기교육 자료실</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
    }
    .apple-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.015);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .apple-card:hover {
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.1);
    }
    *:focus-visible {
      outline: 3px solid #0071e3 !important;
      outline-offset: 2px !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-100 selection:text-blue-800">

  <header class="sticky top-0 z-40 w-full bg-white/70 backdrop-blur-md border-b border-black/[0.04]">
    <div class="max-w-6xl mx-auto px-6 sm:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="#" onclick="showSection('home')" class="flex items-center gap-3 group">
          <div class="w-8 h-8 rounded-lg bg-black text-white flex items-center justify-center font-bold text-sm">W</div>
          <div class="flex flex-col">
            <span class="text-base font-bold tracking-tight text-[#1d1d1f]">무너뜨릴벽은 많다</span>
            <span class="text-[10px] text-[#86868b] font-medium tracking-wide -mt-0.5">장애인식개선 월별 자료실</span>
          </div>
        </a>
        <div class="hidden sm:flex items-center text-xs font-semibold text-[#86868b]">장애가 장벽이 되지 않는 우리 학교</div>
      </div>
    </div>
  </header>

  <main id="main-content" class="flex-grow max-w-6xl w-full mx-auto px-6 sm:px-8 py-4">
    <section id="section-home" class="block">
      <div class="text-center py-6 px-4 mb-4">
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[9px] font-bold bg-black/[0.04] text-[#1d1d1f] mb-3">365 통합교육 아카이브</span>
        <h2 class="text-2xl sm:text-4xl font-extrabold text-[#1d1d1f] tracking-tight mb-3">매달 하나씩, 편견의 벽을 무너뜨리는 수업</h2>
        <p class="text-xs sm:text-sm text-[#86868b] max-w-2xl mx-auto leading-relaxed">1월부터 12월까지 장애와 관련된 기념일을 중심으로 수업자료를 정리한 공간입니다.<br>필요한 달을 선택하고 자료를 바로 확인하세요.</p>
        <div class="mt-4 flex justify-center">
          <button onclick="jumpToCurrentMonth()" class="px-4 py-2 bg-[#0071e3] text-white font-medium rounded-full text-xs hover:scale-102 transition-all">이번 달(5월) 자료실 바로가기 🥳</button>
        </div>
      </div>

      <div class="mb-4 flex justify-between items-baseline border-b border-black/[0.05] pb-2">
        <h3 class="text-sm sm:text-base font-bold text-[#1d1d1f]">월별 기념일 보관소</h3>
        <span class="text-[11px] text-[#86868b]">원하는 달을 선택해 보세요</span>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="calendar-grid"></div>
    </section>

    <section id="section-detail" class="hidden">
      <div class="mb-4">
        <button onclick="showSection('home')" class="inline-flex items-center gap-1.5 text-xs font-semibold text-[#86868b] hover:text-[#1d1d1f]">← 전체 달력으로 돌아가기</button>
      </div>
      <div id="detail-header" class="bg-white border border-black/[0.04] rounded-2xl p-5 shadow-sm mb-5"></div>
      <div class="bg-white border border-black/[0.04] rounded-2xl overflow-hidden shadow-sm mb-6">
        <div class="border-b border-black/[0.04] bg-[#f5f5f7]/60 p-4">
          <h4 class="text-xs sm:text-sm font-bold text-[#1d1d1f]">수업 보급 자료 다운로드</h4>
        </div>
        <div class="p-5">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5" id="files-list"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="preview-modal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-xl w-full max-h-[80vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-5 border-b border-black/[0.05] flex justify-between items-center bg-[#f5f5f7]">
        <div>
          <span class="inline-block bg-black text-white text-[9px] font-bold px-2.5 py-0.5 rounded-full mb-1" id="modal-tag">자료</span>
          <h3 id="modal-title" class="text-sm font-bold text-[#1d1d1f]">미리보기</h3>
        </div>
        <button onclick="closePreviewModal()" class="text-[#86868b] p-2">✕</button>
      </div>
      <div class="p-6 overflow-y-auto flex-grow text-sm text-[#1d1d1f]" id="modal-content-body"></div>
      <div class="p-5 bg-[#f5f5f7] border-t border-black/[0.05] flex justify-between items-center">
        <span class="text-[9px] text-[#86868b]">※ 무상 제공되는 교육 교재입니다.</span>
        <button onclick="triggerFileDownload()" class="px-5 py-2 bg-[#0071e3] text-white font-semibold rounded-full text-xs">다운로드하기</button>
      </div>
    </div>
  </div>

  <div id="custom-toast" class="fixed bottom-6 right-6 bg-[#1d1d1f] text-white px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 z-50 transform translate-y-20 opacity-0 transition-all duration-500 text-sm">
    <div id="toast-msg">알림</div>
  </div>

  <footer class="bg-white border-t border-black/[0.06] mt-8 py-6 text-center sm:text-left text-xs text-[#86868b]">
    <div class="max-w-6xl mx-auto px-6 sm:px-8">
      <p>© 2026 무너뜨릴벽은 많다. All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    const monthlyData = {
      1: { month: "1월", day: "24일", emoji: "🎓", title: "세계 교육의 날", tagline: "장애를 이유로 누구도 배움에서 격리되어서는 안 됩니다.", description: "장애인의 보편적인 학습 권리와 모두를 위한 무장애 교육 인프라를 마련하는 날입니다.", explanation: "1월 24일 세계 교육의 날을 맞이하여 차별 없는 배움터를 구성하기 위한 교육을 전개해 봅니다.", materials: [{ type: "교육자료 (PPT)", name: "1월_세계교육의날_통합교재.ppt", size: "12.4MB", icon: "📊" }, { type: "카드뉴스", name: "1월_장벽없는교실_카드뉴스.pdf", size: "4.2MB", icon: "📱" }, { type: "가정통신문", name: "1월_모두를위한교육_안내서.hwp", size: "1.2MB", icon: "✉️" }] },
      2: { month: "2월", day: "28일", emoji: "🧬", title: "세계 희귀질환의 날", tagline: "겉으로 보이지 않는 신체적 특성을 다정하게 지지하고 포용합니다.", description: "쉽게 드러나지 않는 신체적 다름과 소수 희귀 난치성 질환 친구들을 상생하는 날입니다.", explanation: "겉으로 드러나는 모습만으로 선입견을 가지지 않고 서로를 배려하는 교실 실무 지침서입니다.", materials: [{ type: "교육자료 (PPT)", name: "2월_신체적다름_이해교재.ppt", size: "18.1MB", icon: "📊" }, { type: "카드뉴스", name: "2월_보이지않는특별함_카드뉴스.pdf", size: "3.8MB", icon: "📱" }, { type: "가정통신문", name: "2월_소수포용과돌봄_안내서.hwp", size: "1.4MB", icon: "✉️" }] },
      3: { month: "3월", day: "21일", emoji: "🧦", title: "세계 다운증후군의 날", tagline: "다채로운 양말을 다르게 신어 보며, 서로의 소중한 개성을 찬사합니다.", description: "21번 염색체가 3개인 다운증후군 특징을 이해하고 알록달록 무늬 양말 캠페인을 펼칩니다.", explanation: "서로 다르게 짜여진 염색체나 신체의 차이가 얼마나 아름다운 조화를 이루어내는지 학습합니다.", materials: [{ type: "교육자료 (PPT)", name: "3월_다운증후군의날_교재.ppt", size: "9.8MB", icon: "📊" }, { type: "카드뉴스", name: "3월_짝짝이양말_캠페인_카드뉴스.pdf", size: "5.1MB", icon: "📱" }, { type: "가정통신문", name: "3월_개성존중과상생약속_통신문.hwp", size: "1.1MB", icon: "✉️" }] },
      4: { month: "4월", day: "20일", emoji: "💙", title: "장애인의 날", tagline: "파란 불빛으로 소외를 걷어내고 장애 장벽 철폐를 깊이 학습합니다.", description: "세계 자폐인의 날(2일)과 우리나라 법정 기념일인 장애인의 날(20일)을 학습합니다.", explanation: "자폐 스펙트럼 친구의 감각 상태를 공감해 보고 이동 편의 및 배리어프리의 정체성을 돌아봅니다.", materials: [{ type: "교육자료 (PPT)", name: "4월_장애인의날_이동권_교재.ppt", size: "22.5MB", icon: "📊" }, { type: "카드뉴스", name: "4월_장애인권리선언_카드뉴스.pdf", size: "6.3MB", icon: "📱" }, { type: "가정통신문", name: "4월_차별해소와가정연계학습지.hwp", size: "1.5MB", icon: "✉️" }] },
      5: { month: "5월", day: "05일", emoji: "🎈", title: "통합 교육과 어린이날", tagline: "하나의 운동장에서 특수반과 일반반 구별 없이 뛰노는 평화로운 약속.", description: "놀이기구 편의와 무장애 놀이터 조성을 알아보고 우리 교실의 공평한 통합 우정을 다듬어 갑니다.", explanation: "5월 어린이날을 통하여 모든 어린이가 차별받지 않고 즐거운 놀이를 경험할 수 있는 안전 통합학급을 구축합니다.", materials: [{ type: "교육자료 (PPT)", name: "5월_통합교육과배리어프리놀이터.ppt", size: "14.2MB", icon: "📊" }, { type: "카드뉴스", name: "5월_장벽없는어린이날_카드뉴스.pdf", size: "4.0MB", icon: "📱" }, { type: "가정통신문", name: "5월_통합학급안내와포용교육.hwp", size: "1.3MB", icon: "✉️" }] },
      6: { month: "6월", day: "27일", emoji: "🕯️", title: "헬렌켈러 탄생일", tagline: "중복 장애의 어둠을 뛰어넘어 희망을 쏘아 올린 인권가의 깊은 발자취.", description: "시청각 중복 장애 극복과 촉수화를 파악하며 소통에 대한 인간 존엄의 의지를 배웁니다.", explanation: "눈과 귀가 닫혔으나 평화 활동가가 된 헬렌켈러의 생애를 통해 대화와 연대의 힘을 학습합니다.", materials: [{ type: "교육자료 (PPT)", name: "6월_헬렌켈러생애와장애이해.ppt", size: "11.9MB", icon: "📊" }, { type: "카드뉴스", name: "6월_지촉수화소개_카드뉴스.pdf", size: "3.9MB", icon: "📱" }, { type: "가정통신문", name: "6월_마음의눈을밝히는대화_안내.hwp", size: "1.2MB", icon: "✉️" }] },
      7: { month: "7월", day: "26일", emoji: "🗽", title: "미국 장애인법 제정일", tagline: "이동과 참여의 기본적 가치이자 엘리베이터 권리를 지켜온 무장애 사회의 기원.", description: "전 세계 편의 건축 법안의 기반이 된 역사적 투쟁 사건의 교훈을 마음에 품습니다.", explanation: "휠체어를 내린 아이들의 투쟁을 통해 교실 내의 사소한 문턱들이 얼마나 거대한 벽인지 깨닫습니다.", materials: [{ type: "교육자료 (PPT)", name: "7월_장애인법제정과이동권투쟁사.ppt", size: "15.0MB", icon: "📊" }, { type: "카드뉴스", name: "7월_배리어프리_카드뉴스.pdf", size: "4.5MB", icon: "📱" }, { type: "가정통신문", name: "7월_이웃을배려하는안전보행.hwp", size: "1.1MB", icon: "✉️" }] },
      8: { month: "8월", day: "21일", emoji: "🎨", title: "장애인 예술 활성화 주간", tagline: "붓과 악기로 인간 한계를 멋지게 넘어 도약하는 다정한 명사들을 만납니다.", description: "구족 작가들의 미술 노작과 음악가들의 창작 가치를 체험합니다.", explanation: "소리를 듣지 않고 피아노곡을 완성한 베토벤과 구족화가들의 가슴 벅찬 미술을 탐구합니다.", materials: [{ type: "교육자료 (PPT)", name: "8월_장애예술가_PPT.ppt", size: "13.6MB", icon: "📊" }, { type: "카드뉴스", name: "8월_구족미술_카드뉴스.pdf", size: "5.0MB", icon: "📱" }, { type: "가정통신문", name: "8월_오감으로체험하는미술관여행.hwp", size: "1.2MB", icon: "✉️" }] },
      9: { month: "9월", day: "23일", emoji: "🤟", title: "세계 수어의 날", tagline: "눈으로 노래하고 얼굴로 감정을 그리는 매력적이고 유일무이한 한국 국어.", description: "손짓과 풍부한 표정이 만나 빚어지는 한국수어의 가치와 농문화를 이해합니다.", explanation: "단순한 몸짓의 보완을 넘어 풍부한 표정이 문법적 가치를 발휘하는 아름다운 대화 리듬을 배웁니다.", materials: [{ type: "교육자료 (PPT)", name: "9월_한국수어와대화_수업교안.ppt", size: "16.4MB", icon: "📊" }, { type: "카드뉴스", name: "9월_수어상식_카드뉴스.pdf", size: "4.8MB", icon: "📱" }, { type: "가정통신문", name: "9월_손으로속삭이는사랑과인사.hwp", size: "1.3MB", icon: "✉️" }] },
      10: { month: "10월", day: "15일", emoji: "🦯", title: "흰지팡이의 날", tagline: "자립 보행을 알리는 소중한 이정표인 흰지팡이 보행자를 응원합니다.", description: "도시 편의 노란색 점자 블록의 진정한 기능과 시각장애인의 안전 이동권을 배웁니다.", explanation: "시각 장애인이 스스로 도로를 개척하는 흰지팡이 규칙을 익히고 주변 환경의 장벽을 모니터링합니다.", materials: [{ type: "교육자료 (PPT)", name: "10월_흰지팡이안전수칙_PPT.ppt", size: "11.8MB", icon: "📊" }, { type: "카드뉴스", name: "10월_자립보행_카드뉴스.pdf", size: "5.5MB", icon: "📱" }, { type: "가정통신문", name: "10월_우리안전지킴노란블록.hwp", size: "1.4MB", icon: "✉️" }] },
      11: { month: "11월", day: "04일", emoji: "⠎", title: "한글 점자의 날", tagline: "장애계의 세종대왕, 송암 박두성 할아버지의 6점식 활자 독립 영웅사.", description: "일제 탄압기 비밀리에 우리 자모음을 점자로 지켜낸 눈부신 여섯 개 요철 훈맹정음의 과학.", explanation: "일제 통치 속에서도 지켜낸 훈맹정음을 공부하고, 엘리베이터 점자를 읽어내는 체험을 합니다.", materials: [{ type: "교육자료 (PPT)", name: "11월_한글점자훈맹정음창제_교재.ppt", size: "14.8MB", icon: "📊" }, { type: "카드뉴스", name: "11월_훈맹정음상식_카드뉴스.pdf", size: "4.1MB", icon: "📱" }, { type: "가정통신문", name: "11월_요철로읽는생각의도서관.hwp", size: "1.1MB", icon: "✉️" }] },
      12: { month: "12월", day: "03일", emoji: "🗺️", title: "세계 장애인의 날", tagline: "1년의 고운 마음을 돌아보며 함께 손잡고 상생하는 연말 다정 우수 어린상 시상.", description: "차별을 넘어 더 높은 하모니를 만드는 교실 약속을 회고하고 인권 수칙을 내면에 새깁니다.", explanation: "동정 대신 정당한 자립과 주체적인 권리의 중요성을 인권 관점으로 총정리합니다.", materials: [{ type: "교육자료 (PPT)", name: "12월_세계장애인의날_수업안.ppt", size: "15.9MB", icon: "📊" }, { type: "카드뉴스", name: "12월_우리가꿈꾸는평등교실_카드뉴스.pdf", size: "3.7MB", icon: "📱" }, { type: "가정통신문", name: "12월_서로의다름을칭찬하는통신문.hwp", size: "1.5MB", icon: "✉️" }] }
    };

    let state = { currentView: 'home', currentMonthId: 5 };

    window.addEventListener('DOMContentLoaded', () => {
      renderCalendarGrid();
      showSection('home');
    });

    function renderCalendarGrid() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      Object.keys(monthlyData).forEach(mId => {
        const item = monthlyData[mId];
        const isCurrentMonth = (parseInt(mId) === 5);
        const card = document.createElement('div');
        card.className = `apple-card p-6 sm:p-7 rounded-3xl cursor-pointer flex flex-col justify-between relative ${isCurrentMonth ? 'ring-2 ring-blue-500 bg-white/95 shadow-md' : ''}`;
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-4">
              <span class="text-3xl font-bold text-black bg-[#f5f5f7] w-14 h-14 rounded-2xl flex items-center justify-center shadow-inner">${item.emoji}</span>
              ${isCurrentMonth ? `<span class="absolute top-6 right-6 bg-[#0071e3] text-white text-[10px] font-bold px-3 py-1 rounded-full">이달의 추천</span>` : ''}
            </div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs text-black font-extrabold bg-black/[0.05] px-2.5 py-0.5 rounded-md">${mId}월</span>
              <span class="text-xs text-[#86868b] font-bold">기념일: ${item.day}</span>
            </div>
            <h4 class="text-base sm:text-lg font-bold text-[#1d1d1f] mb-2">${item.title}</h4>
            <p class="text-xs sm:text-sm text-[#86868b] leading-relaxed mb-6 font-light">${item.tagline}</p>
          </div>
          <div class="border-t border-black/[0.04] pt-4 mt-auto flex justify-between items-center text-xs sm:text-sm text-[#86868b]">
            <span class="font-bold text-[#0071e3]">자료실 탐색 →</span>
            <span class="bg-[#f5f5f7] text-black px-2.5 py-0.5 rounded-md font-semibold text-[10px]">자료 3종 완비</span>
          </div>
        `;
        card.addEventListener('click', () => selectMonth(mId));
        grid.appendChild(card);
      });
    }

    function jumpToCurrentMonth() { selectMonth(5); }
    function selectMonth(mId) {
      state.currentMonthId = parseInt(mId);
      renderDetailHeader();
      renderDetailContent();
      showSection('detail');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderDetailHeader() {
      const item = monthlyData[state.currentMonthId];
      document.getElementById('detail-header').innerHTML = `
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
          <div class="flex items-center gap-5">
            <span class="text-4xl bg-[#f5f5f7] border w-16 h-16 rounded-2xl flex items-center justify-center">${item.emoji}</span>
            <div>
              <span class="inline-block text-[10px] font-bold text-[#0071e3] bg-blue-50 px-2.5 py-0.5 rounded-full mb-1">${state.currentMonthId}월 계기교육</span>
              <h3 class="text-xl sm:text-2xl font-bold text-[#1d1d1f]">${item.title} (매년 ${item.day})</h3>
              <p class="text-xs sm:text-sm text-[#86868b] mt-1.5 max-w-xl leading-relaxed">${item.description}</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderDetailContent() {
      const item = monthlyData[state.currentMonthId];
      const listContainer = document.getElementById('files-list');
      listContainer.innerHTML = '';
      item.materials.forEach((file) => {
        const fileCard = document.createElement('div');
        fileCard.className = "apple-card p-6 rounded-2xl flex flex-col justify-between h-52 border border-black/[0.04]";
        fileCard.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-4">
              <span class="text-xs font-extrabold bg-[#0071e3]/10 text-[#0071e3] px-3 py-1 rounded-full">${file.type}</span>
              <span class="text-xl">${file.icon}</span>
            </div>
            <h5 class="text-sm sm:text-base font-bold text-[#1d1d1f] mb-1.5">${file.name}</h5>
            <p class="text-xs text-[#86868b]">용량: ${file.size}</p>
          </div>
          <div class="flex items-center gap-2.5 mt-4 border-t pt-3">
            <button onclick="previewFile('${file.name}', '${encodeURIComponent(item.explanation)}', '${file.type}')" class="flex-1 text-xs sm:text-sm bg-white border hover:bg-black/[0.04] text-[#1d1d1f] font-semibold py-2 rounded-full text-center shadow-sm">내용 미리보기</button>
            <button onclick="triggerFileDownload()" class="px-4 py-2 bg-black text-white text-xs rounded-full">다운</button>
          </div>
        `;
        listContainer.appendChild(fileCard);
      });
    }

    function showSection(secId) {
      state.currentView = secId;
      if (secId === 'home') {
        document.getElementById('section-home').classList.remove('hidden');
        document.getElementById('section-detail').classList.add('hidden');
      } else {
        document.getElementById('section-home').classList.add('hidden');
        document.getElementById('section-detail').classList.remove('hidden');
      }
    }

    function previewFile(fileName, encodedExplanationText, fileType) {
      const cleanText = decodeURIComponent(encodedExplanationText);
      document.getElementById('modal-tag').innerText = fileType;
      document.getElementById('modal-title').innerText = fileName;
      document.getElementById('modal-content-body').innerHTML = `
        <div class="space-y-4">
          <div class="bg-[#f5f5f7] rounded-2xl p-5 text-sm sm:text-base leading-relaxed">
            <h5 class="text-xs font-bold text-black mb-2">📅 이 달의 기념일 상식</h5>
            ${cleanText}
          </div>
        </div>
      `;
      document.getElementById('preview-modal').classList.remove('hidden');
    }

    function closePreviewModal() { document.getElementById('preview-modal').classList.add('hidden'); }
    function triggerFileDownload() { closePreviewModal(); showToast("파일 다운로드가 완료되었습니다."); }
    
    function showToast(message) {
      const toast = document.getElementById('custom-toast');
      document.getElementById('toast-msg').innerText = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
    }
  </script>
</body>
</html>
